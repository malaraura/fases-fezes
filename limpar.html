<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Limpando Cache • Fases e Fezes</title>
  <style>
    body {
      background-color: #183332;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 28px 24px;
      max-width: 400px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #38BDF8;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin: 0 auto 20px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 20px;
      color: #38BDF8;
    }
    p {
      margin: 0 0 20px 0;
      font-size: 14px;
      color: #CBD5E1;
      line-height: 1.5;
    }
    .status {
      font-size: 12px;
      color: #94A3B8;
      font-family: monospace;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px 12px;
      border-radius: 8px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Atualizando Fases e Fezes</h2>
    <p>Purgando versão antiga da memória do aparelho e carregando a versão mais recente (v2.1)...</p>
    <div id="status" class="status">Iniciando limpeza profunda...</div>
  </div>

  <script>
    async function executarLimpezaEAtualizacao() {
      const statusEl = document.getElementById('status');
      
      try {
        // 1. Desregistrar todos os Service Workers
        statusEl.textContent = '1/4 Desregistrando Service Workers...';
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const reg of registrations) {
            await reg.unregister();
          }
        }

        // 2. Apagar todos os caches locais
        statusEl.textContent = '2/4 Deletando caches locais...';
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const key of keys) {
            await caches.delete(key);
          }
        }

        // 3. Limpar localStorage
        statusEl.textContent = '3/4 Atualizando registros de versão...';
        try {
          localStorage.removeItem('app_pwa_version');
          localStorage.setItem('app_force_version', '2.1');
        } catch (e) {}

        // 4. Redirecionar com buster definitivo
        statusEl.textContent = '4/4 Concluído! Abrindo aplicativo...';
        setTimeout(function() {
          window.location.replace('/?v=2.1&t=' + Date.now());
        }, 500);

      } catch (err) {
        statusEl.textContent = 'Aviso: ' + err.message + '. Redirecionando...';
        setTimeout(function() {
          window.location.replace('/?v=2.1');
        }, 800);
      }
    }

    window.addEventListener('load', executarLimpezaEAtualizacao);
  </script>
</body>
</html>
